name: Three-style UI validation (single run)

on:
  push:
    branches:
      - ui/three-style-overhaul
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: three-style-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android UI validation
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android SDK components
        run: |
          sdkmanager --install "cmdline-tools;latest" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve packages
        run: flutter pub get
      - name: Format modified UI files
        run: |
          dart format lib/core/theme/visual_style_mode.dart lib/core/theme/visual_style_theme.dart lib/core/theme/visual_style_widgets.dart lib/providers/theme_provider.dart lib/app.dart lib/modules/settings/settings_page.dart lib/modules/login/login_page.dart lib/modules/search/search_page.dart lib/modules/search/hot_search_board_card.dart lib/modules/library/library_page.dart lib/widgets/md3e_transport_row.dart lib/modules/discover/discover_page.dart lib/widgets/player_playlist_view.dart lib/widgets/sliding_segmented_control.dart lib/widgets/song_list_item.dart lib/modules/user/user_center_page.dart lib/modules/user/favorites_page.dart lib/modules/personal_fm/personal_fm_section.dart lib/core/layout/responsive_layout.dart test/core/theme/visual_styles_test.dart test/providers/theme_provider_nav_label_behavior_test.dart
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Theme and login regression tests
        run: flutter test --reporter expanded test/core/theme/visual_styles_test.dart test/modules/login/login_page_test.dart test/providers/theme_provider_nav_label_behavior_test.dart
      - name: Compile Android debug APK once
        run: flutter build apk --debug --flavor standard --split-per-abi --target-platform android-arm64
      - name: Upload compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: MD3Music-three-style-android-arm64-debug
          path: build/app/outputs/flutter-apk/*arm64*debug.apk
          if-no-files-found: error
          retention-days: 14
